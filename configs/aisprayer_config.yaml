# AiSprayer 统一生产配置文件

# 1. 硬件层配置 (Hardware)
hardware:
  camera:
    model: "orbbec"             # 可选: orbbec, realsense
  robot:
    ip: "192.168.2.14"          # 机械臂控制器 IP
    port: 6001                  # 机械臂控制端口 (默认 6001)
    global_speed_percent: 50    # 示教/远程/运行全局速度百分比 (startup 时 set_speed)
    robot_urdf: "configs/m530_r6.urdf.xml"
    robot_srdf: "configs/m530_r6.srdf.xml"
    robot_tcp: "spray_nozzle_link"
    robot_group: "manipulator"

# 2. 视觉与规划层配置 (Vision & Planning)
vision:
  output_root: "data/runs"      # 生产运行数据存储根目录
  
  planner:
    calib_path: "configs/calib/calibration_result.yaml"
    model_path: "models/wissight.pt"
    spray_width_mm: 100.0
    overlap_rate: 0.2
    spray_dist_mm: 100.0
    v_step_mm: 20.0
    # 机械臂工作空间安全限位 (单位: mm)
    workspace_limits:
      x: [500.0, 1800.0]
      y: [-1600.0, 1600.0]
      z: [100.0, 1800.0]

# 3. 标定算法配置 (Calibration)
calib:
  capture:
    output_dir: "data/calib"    # 标定采集数据存储根目录
  
  # 标定计算结果保存路径 (默认与视觉规划引用的路径一致)
  result_path: "configs/calib/calibration_result.yaml"
  
  # 数据清洗阈值 (允许视觉位移与物理位移的偏差比例，0.05 代表 ±5%)
  cleaning_threshold: 0.05
  
  board:
    rows: 12                    # 标定板行数 (节点数)
    cols: 9                     # 标定板列数 (节点数)
    square_size_mm: 15.0        # 棋盘格格子大小 (mm)
  
  # RootPoint 安全点位数据库路径
  root_points_path: "data/calib/root_points.yaml"

  # 自动对准参数 (Aligner)
  align:
    safe_pose: [460.0, 125.0, 1077.0, -3.141, 0.0, 0.0]  # 安全过渡点 [X, Y, Z, A, B, C]
    speed: 50                   # 运动速度 (mm/s)
# 喷涂作业参数
spraying:
  ready_dist_mm: 300.0   # 准备点后撤距离
  velocity: 150.0        # 喷涂移动速度 (mm/s)
  pl: 2                  # 平滑级别 (0-5), 越大越平衡，但是也越容易偏离预定轨迹点
  tool_num: 0            # 默认工具号
